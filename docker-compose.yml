name: peaceone

services:
  postgres:
    image: postgres:16
    container_name: peaceone-postgres
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - peaceone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  peaceone_pgdata:
    name: peaceone_pgdata
